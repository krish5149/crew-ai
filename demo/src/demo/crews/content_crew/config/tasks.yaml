research_task:
  description: >
    Research {topic} and produce a set of findings that reflects the state of
    play as of {current_year}. Cover what changed recently, who the notable
    players are, and where the open questions sit.

    Report only what you can attribute. Where the evidence is thin or
    contested, say so explicitly rather than presenting it as settled.
  expected_output: >
    A list of 8-10 findings. Each finding is one or two sentences plus its
    source, formatted as a markdown bullet. No preamble, no closing summary.
  agent: researcher

reporting_task:
  description: >
    Turn the research findings into a report on {topic} for a reader who has
    not seen the source material.

    Lead with the conclusion. Group the findings into themes rather than
    listing them in the order they were gathered. Drop findings that do not
    change what the reader would do next.
  expected_output: >
    A markdown report with: a two-to-three sentence summary at the top, then
    one section per theme with the supporting findings and their sources, then
    a short "open questions" section. No code fences wrapping the document.
  agent: reporting_analyst
  context:
    - research_task
  output_file: output/report.md
  